name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: kujo check + offline test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Kujo runtime
        uses: kujolang/kujo/.github/actions/setup-kujo@ed51720892d8e475980909dffe54c8fba8731e11
        with:
          version: v1.2.0

      - name: Verify Kujo runtime
        run: |
          command -v kujo
          kujo --version

      - name: Lint (kujo check)
        run: make check

      - name: Test (unit + CLI integration, offline)
        run: make test
