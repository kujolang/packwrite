name: "PackWrite launch readiness review"
goal: "Keep PackWrite locally release-ready as a Kujo-native workflow-pack compiler that turns project intent into validated agent execution packs."
version: "1.0.0"
background: "PackWrite is part of the Kujo prelaunch supporting-tooling matrix. The verified scope is local prompt-to-agent-pack compilation with offline fake-response proof, staged writes, path-safety checks, and deterministic validation."
scope: "Repository-local CLI behavior, wrapper compatibility, offline fake-response generation, pack validation, config/doctor/prompt commands, path-safety boundaries, docs/readiness wording, and launch evidence capture."
non_goals:
  - "Publishing packages or public releases"
  - "Pushing final release tags"
  - "Using live provider credentials during local launch review"
  - "Claiming hosted production or enterprise workflow governance"
relevant_systems:
  - "Kujo runtime"
  - "PackWrite wrapper"
  - "MEGA_PROMPT.md"
  - "packwrite.toml"
  - "agent/ pack output"
  - "prelaunch launch evidence packet"
likely_files:
  - "README.md"
  - "packwrite.kujo"
  - "bin/packwrite"
  - "src/command.kujo"
  - "src/config.kujo"
  - "src/pack.kujo"
  - "src/validate.kujo"
  - "tests/run.sh"
  - "tests/cli_integration.sh"
  - "tests/packwrite_eval.json"
acceptance_criteria:
  - "`make check` passes for all Kujo source and test files."
  - "`make test` passes the offline unit and CLI integration suites."
  - "`packwrite --help` and `packwrite version` work from PATH."
  - "Offline fake-response `init`, `validate`, `doctor`, `config`, and prompt flows remain covered by tests or Eval."
  - "Docs and launch evidence state that live provider credentials, publishing, release tags, hosted production, and enterprise governance are external."
eval_requirements:
  - description: "PackWrite help succeeds."
    check_type: "command_succeeds"
    params:
      command: "packwrite --help"
  - description: "PackWrite version succeeds."
    check_type: "command_succeeds"
    params:
      command: "packwrite version"
  - description: "PackWrite offline suite succeeds."
    check_type: "command_succeeds"
    params:
      command: "make test"
risks:
  - risk: "Live provider behavior requires approved credentials and provider-specific policy proof."
    mitigation: "Use offline fake-response tests locally and record live provider proof as external."
    severity: "high"
  - risk: "Generated agent packs may encode flawed project strategy even when the structure validates."
    mitigation: "Require human review of generated packs before downstream agents execute them."
    severity: "medium"
  - risk: "Raw model responses can contain sensitive data when explicitly saved."
    mitigation: "Keep `--save-raw-response` intentional and document that raw responses require review before sharing or committing."
    severity: "medium"
dependencies:
  - "kujo on PATH or KUJO set"
  - "make"
  - "Bash 3.2+"
review_expectations:
  - "Review generated packs before implementation agents use them."
  - "Review provider endpoints and secret handling before live model use."
human_approval_points:
  - "Before publishing packages or public releases"
  - "Before pushing final release tags"
  - "Before running live provider generation with real credentials"
  - "Before claiming hosted production or enterprise governance readiness"
priority: "high"
tags:
  - "kujo"
  - "packwrite"
  - "launch-readiness"
